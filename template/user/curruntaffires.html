{% include "user/navbar.html" %}
{% include "user/base.html" %}


<style>
    .current-affairs{
    padding:80px 8%;
    background:#f8f9fc;
}

.affairs-heading{
    text-align:center;
    margin-bottom:50px;
}

.affairs-heading h2{
    font-size:42px;
    color:#0A2A66;
    margin-bottom:10px;
}

.affairs-heading p{
    color:#666;
}

.affairs-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:25px;
}

.affair-card{
    background:#fff;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
    transition:.3s;
    border-top:5px solid #0A2A66;
}

.affair-card:hover{
    transform:translateY(-8px);
}

.date{
    display:inline-block;
    background:#0A2A66;
    color:#fff;
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    margin-bottom:15px;
}

.affair-card h3{
    color:#0A2A66;
    font-size:22px;
    margin-bottom:12px;
}

.affair-card p{
    color:#555;
    line-height:1.7;
}
</style>
{% for i in affairs %}

<div class="affair-card">

    <span class="date">
        {{ i.date }}
    </span>

    <h3>
        {{ i.title }}
    </h3>

    <p>
        {{ i.description }}
    </p>

</div>

{% empty %}

<div class="affair-card">
    <h3>No Current Affairs Available</h3>
    <p>सध्या कोणताही डेटा उपलब्ध नाही.</p>
</div>

{% endfor %}
