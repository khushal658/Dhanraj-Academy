
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

{% include "admin/navbar.html" %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10 col-12">

            <div class="card border-0 shadow-lg rounded-4">

                <!-- HEADER -->
                <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                    <h3 class="mb-0 fw-bold text-white">
                        <i class="fa fa-trophy me-2"></i>
                        Update Contact Locations
                    </h3>
                </div>

                <!-- BODY -->
                <div class="card-body p-4">

                    <form method="POST" enctype="multipart/form-data" id="locationForm">
                        {% csrf_token %}

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Title</label>
                                <input type="text" name="title" value="{{ update.title }}" class="form-control form-control-lg" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Dec</label>
                                <input type="text" name="dec" value="{{ update.dec }}" class="form-control form-control-lg" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Academy_name</label>
                                <input type="text" name="academy_name" value="{{ update.academy_name }}" class="form-control form-control-lg" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Address</label>
                                <input type="text" name="address" value="{{ update.address }}" class="form-control form-control-lg" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Mobile</label>
                                <input type="text" name="mobile" value="{{ update.mobile }}" class="form-control form-control-lg" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="text" name="email" value="{{ update.email }}" class="form-control form-control-lg" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Time</label>
                                <input type="text" name="time" value="{{ update.time }}" class="form-control form-control-lg" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Add</label>
                                <input type="text" name="add" value="{{ update.add }}" class="form-control form-control-lg" required>
                            </div>

                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 mt-4 rounded-3">
                            <i class="fa fa-save me-2"></i>
                            Update Contact Locations
                        </button>

                    </form>

                </div>

            </div>

        </div>
    </div>
</div>

{% include "admin/footer.html" %}

<!-- JS VALIDATION + POPUP -->
<script>
    document.getElementById("locationForm").addEventListener("submit", function(e) {
        
        let inputs = document.querySelectorAll("#locationForm input");
        let valid = true;

        inputs.forEach(input => {
            if (input.value.trim() === "") {
                valid = false;
            }
        });

        if (!valid) {
            alert("Please fill all fields!");
            e.preventDefault();
        } else {
            alert("Form submitted successfully!");
        }
    });
</script>
