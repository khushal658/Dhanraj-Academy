{% include "admin/navbar.html" %}



<!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> -->

<style>
.update-card{
    max-width:1200px;
    margin:40px auto;
    background:#fff;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    overflow:hidden;
}

input{
    color: black;
}

.update-header{
    background:linear-gradient(135deg,#0d6efd,#0b5ed7);
    color:white;
    padding:20px;
    text-align:center;
}

.update-header h2{
    margin:0;
    font-weight:700;
}

.update-body{
    padding:30px;
}

.form-label{
    font-weight:600;
    margin-bottom:8px;
}

.form-control{
    border-radius:12px;
    border:1px solid #ddd;
    padding:12px;
}

.form-control:focus{
    border-color:#0d6efd;
    box-shadow:0 0 10px rgba(13,110,253,.2);
}

.btn-update{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#0d6efd;
    color:#fff;
    font-weight:600;
}

.btn-update:hover{
    background:#0b5ed7;
}
</style>

<div class="container">

    <div class="update-card">

        <div class="update-header">
            <h2>Update About Information</h2>
        </div>

        <div class="update-body">

            <form method="POST">
                {% csrf_token %}

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Heading</label>
                        <input type="text"
                               name="heading"
                               value="{{ update.heading }}"
                               class="form-control">
                    </div>

                    <div class="col-md-8 mb-3">
                        <label class="form-label">Paragraph</label>
                        <textarea name="paragraph"
                                  rows="5"
                                  class="form-control">{{ update.paragraph }}</textarea>
                    </div>

                </div>

                <hr>

                <div class="row">

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Training Number</label>
                        <input type="text"
                               name="train_number"
                               value="{{ update.train_number }}"
                               class="form-control">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Students Number</label>
                        <input type="text"
                               name="selc_stud"
                               value="{{ update.stu_num }}"
                               class="form-control">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Faculty Number</label>
                        <input type="text"
                               name="expfac_num"
                               value="{{ update.expfac_num }}"
                               class="form-control">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Course Number</label>
                        <input type="text" name="course_num" value="{{ update.course_num }}" class="form-control">
                    </div>

                </div>

                <button type="submit" class="btn-update">
                    Update Information
                </button>

            </form>

        </div>

    </div>

</div>

{% include "admin/footer.html" %}
