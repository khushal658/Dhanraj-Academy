<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

{% include "admin/navbar.html" %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8 col-md-10 col-12">

            <div class="card border-0 shadow-lg rounded-4">

                <!-- HEADER -->
                <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                    <h3 class="mb-0 fw-bold">
                        <i class="fa fa-trophy me-2"></i>
                        Update Result
                    </h3>
                </div>

                <!-- BODY -->
                <div class="card-body p-4">

                    <form action="{% url 'update_result' result.id %}" method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Student Name</label>
                                <input type="text" name="name" value="{{ result.name }}" class="form-control form-control-lg">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Year</label>
                                <input type="text" name="year" value="{{ result.year }}" class="form-control form-control-lg">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Rank</label>
                                <input type="text" name="rank" value="{{ result.rank }}" class="form-control form-control-lg">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Category</label>
                                <select name="category" class="form-select form-select-lg">
                                    <option value="Police" {% if result.category == 'Police' %}selected{% endif %}>Police</option>
                                    <option value="Gramsevak" {% if result.category == 'Gramsevak' %}selected{% endif %}>Gramsevak</option>
                                    <option value="Vanrakshak" {% if result.category == 'Vanrakshak' %}selected{% endif %}>Vanrakshak</option>
                                    <option value="MPSC" {% if result.category == 'MPSC' %}selected{% endif %}>MPSC</option>
                                    <option value="Talathi" {% if result.category == 'Talathi' %}selected{% endif %}>Talathi</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Student Image</label>
                                <input type="file" name="image" class="form-control">

                                {% if result.image %}
                                <div class="mt-3 text-center">
                                    <img src="{{ result.image.url }}"
                                         class="img-thumbnail rounded-4 shadow"
                                         style="max-width:200px;">
                                </div>
                                {% endif %}
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Title</label>
                                <input type="text" name="title" value="{{ result.title }}" class="form-control form-control-lg">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Post</label>
                                <input type="text" name="post" value="{{ result.post }}" class="form-control form-control-lg">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Education</label>
                                <input type="text" name="education" value="{{ result.education }}" class="form-control form-control-lg">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Posting</label>
                                <input type="text" name="posting" value="{{ result.posting }}" class="form-control form-control-lg">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Preparation</label>
                                <input type="text" name="preparation" value="{{ result.preparation }}" class="form-control form-control-lg">
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Success Journey</label>
                                <textarea name="success_journey" rows="3" class="form-control">{{ result.success_journey }}</textarea>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Daily Routine</label>
                                <textarea name="daily_routine" rows="3" class="form-control">{{ result.daily_routine }}</textarea>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Message for Students</label>
                                <textarea name="student_message" rows="3" class="form-control">{{ result.student_message }}</textarea>
                            </div>

                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 mt-4 rounded-3">
                            <i class="fa fa-save me-2"></i>
                            Update Result
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% include "admin/footer.html" %}
