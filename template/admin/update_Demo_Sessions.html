<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

{% include "admin/navbar.html" %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8 col-md-10 col-12">

            <div class="card border-0 shadow-lg rounded-4">

                <!-- HEADER -->
                <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                    <h3 class="mb-0 fw-bold text-white">
                        <i class="fa fa-trophy me-2"></i>
                        Update Demo Profile
                    </h3>
                </div>

                <!-- BODY -->
                <div class="card-body p-4">

                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="row g-3">



                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Profiles</label>
                                <input type="file" name="sub_video" value="{{ update.sub_video }}"
                                    class="form-control form-control-lg">
                            </div>
                                {% if update.sub_video %}
                                <video controls width="300" height="100px">
                                    <source src="/{{ update.sub_video }}" type="video/mp4">
                                </video>
                                {% endif %}


                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Title</label>
                                <input type="text" name="title" value="{{ update.title }}"
                                    class="form-control form-control-lg">
                            </div>


                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Dec</label>
                                <input type="text" name="dec" value="{{ update.dec }}"
                                    class="form-control form-control-lg">
                            </div>





                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Button</label>
                                <input type="text" name="sub_btn" value="{{ update.sub_btn }}"
                                    class="form-control form-control-lg">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">sub_dec</label>
                                <input type="text" name="sub_dec" value="{{ update.sub_dec }}"
                                    class="form-control form-control-lg">
                            </div>

                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 mt-4 rounded-3">
                            <i class="fa fa-save me-2"></i>
                            Update Teacher profile
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% include "admin/footer.html" %}
