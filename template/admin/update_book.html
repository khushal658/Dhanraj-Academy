<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
{% include "admin/navbar.html" %}

<style>
body{
    background:#f1f5f9;
    font-family:'Poppins',sans-serif;
}

.custom-card{
    background:#fff;
    border-radius:16px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
    margin:20px auto;
    max-width:1100px;
    overflow:hidden;
}

.card-head{
    padding:18px 26px;
    display:flex;
    align-items:center;
    gap:10px;
    color:#fff;
}

.card-head.blue{background:#1a56db;}

.card-body{padding:24px;}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-bottom:20px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field label{
    font-size:13px;
    font-weight:600;
    color:#475569;
}

.field input,
.field select{
    height:46px;
    border-radius:10px;
    border:1px solid #dbe2ea;
    padding:10px 12px;
    font-size:14px;
    outline:none;
    transition:.2s;
}

.field input:focus,
.field select:focus{
    border-color:#1a56db;
    box-shadow:0 0 0 3px rgba(26,86,219,.15);
}

.save-btn{
    width:100%;
    height:50px;
    background:#1a56db;
    color:#fff;
    border:none;
    border-radius:12px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:.3s;
}

.save-btn:hover{
    background:#1641a3;
    transform:translateY(-2px);
}

/* RESPONSIVE */
@media(max-width:992px){
    .stats-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:576px){
    .stats-grid{
        grid-template-columns:1fr;
    }

    .card-body{
        padding:18px;
    }
}
</style>

<div class="custom-card">

    <div class="card-head blue">
        <i class="ti ti-edit"></i>
        <h3>Update Book</h3>
    </div>

    <div class="card-body">

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="stats-grid">

                <div class="field">
                    <label>Icon</label>
                    <input type="text" name="icon" value="{{ book.icon }}">
                </div>

                <div class="field">
                    <label>Book Name</label>
                    <input type="text" name="book_name" value="{{ book.book_name }}">
                </div>

                <div class="field">
                    <label>Category</label>
                    <select name="category" class="form-select">
                        <option value="POLICE" {% if book.category == 'POLICE' %}selected{% endif %}>Police Bharti</option>
                        <option value="MPSC" {% if book.category == 'MPSC' %}selected{% endif %}>MPSC</option>
                        <option value="GRAMSEVAK" {% if book.category == 'GRAMSEVAK' %}selected{% endif %}>Gramsevak</option>
                        <option value="TALATHI" {% if book.category == 'TALATHI' %}selected{% endif %}>Talathi</option>
                        <option value="VANRAKSHAK" {% if book.category == 'VANRAKSHAK' %}selected{% endif %}>Vanrakshak</option>
                    </select>
                </div>

            </div>

            <div class="mb-3">
                <!-- <label class="form-label">Current File</label><br> -->
                {% if book.upload_book %}
                    <a href="{{ book.upload_book.url }}">
                        <!-- View File -->
                    </a>
                {% endif %}
            </div>

            <div class="mb-3">
                <label class=" text-info form-label ">Upload New File</label>
                <input type="file" name="upload_book" class="form-control">
            </div>

            <button type="submit" class="save-btn">
                <i class="ti ti-device-floppy"></i>
                Update Book
            </button>

        </form>

    </div>

</div>

{% include "admin/footer.html" %}
