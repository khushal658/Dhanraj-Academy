{% include "admin/navbar.html" %}

<style>
/* ===== PAGE WRAPPER ===== */
.update-container{
    max-width:1000px;
    margin:40px auto;
    background:#ffffff;
    padding:35px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,0.12);
    border-top:5px solid #2563eb;
}

/* ===== TITLE ===== */
.update-title{
    text-align:center;
    font-size:30px;
    font-weight:700;
    color:#2563eb;
    margin-bottom:8px;
}

.update-subtitle{
    text-align:center;
    color:#64748b;
    margin-bottom:30px;
}

/* ===== GRID ===== */
.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

/* ===== CARD ===== */
.form-card{
    background:#f8fafc;
    padding:18px;
    border-radius:14px;
    border:1px solid #e2e8f0;
}

/* ===== LABEL ===== */
.form-label{
    display:block;
    font-weight:600;
    color:#1e293b;
    margin-bottom:8px;
}

/* ===== INPUT ===== */
.form-input,
.form-textarea{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #cbd5e1;
    outline:none;
    font-size:15px;
    box-sizing:border-box;
    transition:0.2s;
}

.form-input:focus,
.form-textarea:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,0.15);
}

/* ===== TEXTAREA ===== */
.form-textarea{
    resize:none;
}

/* ===== SECTION HEADERS ===== */
.section-title{
    font-size:18px;
    font-weight:700;
    color:#1d4ed8;
    margin-bottom:10px;
}

/* ===== BUTTON ===== */
.btn-wrapper{
    text-align:center;
    margin-top:30px;
}

.submit-btn{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    border:none;
    padding:14px 40px;
    font-size:16px;
    font-weight:600;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
}

.submit-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(37,99,235,0.3);
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
    .form-grid{
        grid-template-columns:1fr;
    }
}
</style>

<div class="update-container">

    <h2 class="update-title">Update Record</h2>
    <p class="update-subtitle">Edit and update your competition details</p>

    <form action="/save_stats/" method="POST">

        {% csrf_token %}

        <!-- IMPORTANT ID -->
        <input type="hidden" name="id" value="{{ obj.id }}">

        <div class="form-grid">

            <!-- MAIN HEADING -->
            <div class="form-card" style="grid-column:1/3;">
                <label class="form-label">Main Heading</label>
                <input type="text" name="main_heading"
                       value="{{ obj.main_heading }}"
                       class="form-input" required>
            </div>

            <!-- ABOUT -->
            <div class="form-card" style="grid-column:1/3;">
                <label class="form-label">About Description</label>
                <textarea name="about_description" rows="4"
                          class="form-textarea" required>{{ obj.about_description }}</textarea>
            </div>

            <!-- VISION -->
            <div class="form-card" style="grid-column:1/3;">
                <label class="form-label">Vision</label>
                <textarea name="vision_description" rows="3"
                          class="form-textarea" required>{{ obj.vision_description }}</textarea>
            </div>

            <!-- TIMELINES -->
            <div class="form-card">
                <div class="section-title">Timeline 1</div>
                <input type="number" name="year1"
                       value="{{ obj.year1 }}" class="form-input">
                <textarea name="timeline1" rows="2" class="form-textarea">{{ obj.timeline1 }}</textarea>
            </div>

            <div class="form-card">
                <div class="section-title">Timeline 2</div>
                <input type="number" name="year2"
                       value="{{ obj.year2 }}" class="form-input">
                <textarea name="timeline2" rows="2" class="form-textarea">{{ obj.timeline2 }}</textarea>
            </div>

            <div class="form-card">
                <div class="section-title">Timeline 3</div>
                <input type="number" name="year3"
                       value="{{ obj.year3 }}" class="form-input">
                <textarea name="timeline3" rows="2" class="form-textarea">{{ obj.timeline3 }}</textarea>
            </div>

            <div class="form-card">
                <div class="section-title">Timeline 4</div>
                <input type="number" name="year4"
                       value="{{ obj.year4 }}" class="form-input">
                <textarea name="timeline4" rows="2" class="form-textarea">{{ obj.timeline4 }}</textarea>
            </div>

        </div>

        <div class="btn-wrapper">
            <button type="submit" class="submit-btn">
                Update Now
            </button>
        </div>

    </form>

</div>

{% include "admin/footer.html" %}


{% if request.GET.updated %}
<script>
    alert("Statistics successfully updated!");
</script>
{% endif %}
