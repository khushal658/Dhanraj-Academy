{% include "admin/navbar.html" %}

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f1f5f9;
    font-family:Arial,sans-serif;
}

.container{
    max-width:700px;
    margin:40px auto;
    padding:20px;
}

.card{
    background:#fff;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.page-title{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    color:#4f46e5;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:20px;
}

.form-label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#374151;
}

.form-control{
    width:100%;
    height:55px;
    padding:12px 15px;
    border:2px solid #d1d5db;
    border-radius:12px;
    font-size:15px;
    outline:none;
}

.form-control:focus{
    border-color:#4f46e5;
}

.btn{
    border:none;
    cursor:pointer;
    text-decoration:none;
    padding:12px 20px;
    border-radius:10px;
    font-size:15px;
    font-weight:600;
}

.btn-primary{
    background:#4f46e5;
    color:white;
}

.btn-primary:hover{
    background:#4338ca;
}

.btn-secondary{
    background:#6b7280;
    color:white;
}

.btn-secondary:hover{
    background:#4b5563;
}

.btn-box{
    display:flex;
    gap:10px;
}

@media(max-width:768px){
    .container{
        width:100%;
        padding:10px;
    }

    .btn-box{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }
}
</style>

<div class="container">
    <div class="card">

        <h2 class="page-title">
            Update Course
        </h2>

        <form method="POST" id="courseForm">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">
                    Course Name
                </label>

                <input
                    type="text"
                    name="course_name"
                    value="{{update.course_name}}"
                    class="form-control"
                    required>
            </div>

            <div class="btn-box">

                <button type="submit" class="btn btn-primary">
                    Update Course
                </button>

                <a href="/contact_course/" class="btn btn-secondary">
                    Back
                </a>

            </div>

        </form>

    </div>
</div>

{% include "admin/footer.html" %}

<!-- JS VALIDATION + POPUP -->
<script>
document.getElementById("courseForm").addEventListener("submit", function(e){

    let input = document.querySelector("#courseForm input");
    
    if(input.value.trim() === ""){
        alert("Please fill the course name!");
        e.preventDefault();
    }else{
        alert("Course updated successfully!");
    }

});
</script>
