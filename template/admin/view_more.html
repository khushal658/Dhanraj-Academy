<form action="/save_exam_detail/" method="POST"
style="
max-width:1000px;
margin:40px auto;
background:#ffffff;
padding:35px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
">

    {% csrf_token %}

    <h2 style="
    text-align:center;
    color:#2563eb;
    margin-bottom:30px;
    ">
        Exam Details Form
    </h2>


    <label>Select Latest Update Card</label>

<select name="latest_update" required
style="
width:100%;
padding:12px;
border:1px solid #d1d5db;
border-radius:8px;
margin-bottom:20px;
">

   {% for update in latest_updates %}

<option value="{{ update.id }}">
    {{ update.heading }}
</option>

{% endfor %}

</select>

    <!-- Hero Section -->

    <h3 style="
    color:#1e40af;
    border-bottom:2px solid #2563eb;
    padding-bottom:10px;
    margin-bottom:20px;
    ">
        Hero Section
    </h3>

    <label style="font-weight:600;display:block;margin-bottom:8px;">
        Exam Name
    </label>

    <input type="text"
    name="exam_name"
    placeholder="Enter Exam Name"
    style="
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    margin-bottom:15px;
    ">

    <label style="font-weight:600;display:block;margin-bottom:8px;">
        Hero Heading
    </label>

    <input type="text"
    name="hero_heading"
    placeholder="Enter Hero Heading"
    style="
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    margin-bottom:15px;
    ">

    <label style="font-weight:600;display:block;margin-bottom:8px;">
        Hero Description
    </label>

    <textarea
    name="hero_description"
    rows="4"
    style="
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    margin-bottom:20px;
    "></textarea>

    <!-- Overview -->

    <h3 style="
    color:#1e40af;
    border-bottom:2px solid #2563eb;
    padding-bottom:10px;
    margin:30px 0 20px;
    ">
        Overview
    </h3>

    <label style="font-weight:600;display:block;margin-bottom:8px;">
        Overview Title
    </label>

    <input type="text"
    name="overview_title"
    placeholder="Overview Title"
    style="
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    margin-bottom:15px;
    ">

    <label style="font-weight:600;display:block;margin-bottom:8px;">
        Overview Description
    </label>

    <textarea
    name="overview"
    rows="5"
    style="
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    margin-bottom:20px;
    "></textarea>


    <!-- Physical Test -->

<!-- Physical Test -->

            <h3 style="
            color:#1e40af;
            border-bottom:2px solid #2563eb;
            padding-bottom:10px;
            margin:30px 0 20px;
            ">
                Physical Test
            </h3>

            <label style="font-weight:600;display:block;margin-bottom:8px;">
                Physical Test Heading
            </label>

            <input type="text"
            name="physical_title"
            placeholder="Enter Physical Test Heading"
            style="
            width:100%;
            padding:12px;
            border:1px solid #d1d5db;
            border-radius:8px;
            margin-bottom:15px;
            ">

            <label style="font-weight:600;display:block;margin-bottom:8px;">
                Physical Point 1
            </label>

            <input type="text"
            name="physical_point_1"
            placeholder="Physical Point 1"
            style="
            width:100%;
            padding:12px;
            border:1px solid #d1d5db;
            border-radius:8px;
            margin-bottom:12px;
            ">

            <label style="font-weight:600;display:block;margin-bottom:8px;">
                Physical Point 2
            </label>

            <input type="text"
            name="physical_point_2"
            placeholder="Physical Point 2"
            style="
            width:100%;
            padding:12px;
            border:1px solid #d1d5db;
            border-radius:8px;
            margin-bottom:12px;
            ">

            <label style="font-weight:600;display:block;margin-bottom:8px;">
                Physical Point 3
            </label>

            <input type="text"
            name="physical_point_3"
            placeholder="Physical Point 3"
            style="
            width:100%;
            padding:12px;
            border:1px solid #d1d5db;
            border-radius:8px;
            margin-bottom:12px;
            ">

            <label style="font-weight:600;display:block;margin-bottom:8px;">
                Physical Point 4
            </label>

            <input type="text"
            name="physical_point_4"
            placeholder="Physical Point 4"
            style="
            width:100%;
            padding:12px;
            border:1px solid #d1d5db;
            border-radius:8px;
            margin-bottom:12px;
            ">

            <label style="font-weight:600;display:block;margin-bottom:8px;">
                Physical Point 5
            </label>

            <input type="text"
            name="physical_point_5"
            placeholder="Physical Point 5"
            style="
            width:100%;
            padding:12px;
            border:1px solid #d1d5db;
            border-radius:8px;
            margin-bottom:20px;
            ">

    <!-- Written Exam -->

    <h3 style="
    color:#1e40af;
    border-bottom:2px solid #2563eb;
    padding-bottom:10px;
    margin:30px 0 20px;
    ">
        Written Exam
    </h3>

    <label style="font-weight:600;display:block;margin-bottom:8px;">
        Written Exam Heading
    </label>

    <input type="text"
    name="written_title"
    placeholder="Written Exam Heading"
    style="
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    margin-bottom:15px;
    ">

 

    <input type="text" name="written_point_1"
    placeholder="Written Point 1"
    style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;margin-bottom:12px;">

    <input type="text" name="written_point_2"
    placeholder="Written Point 2"
    style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;margin-bottom:12px;">

    <input type="text" name="written_point_3"
    placeholder="Written Point 3"
    style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;margin-bottom:12px;">

    <input type="text" name="written_point_4"
    placeholder="Written Point 4"
    style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;margin-bottom:12px;">

    <input type="text" name="written_point_5"
    placeholder="Written Point 5"
    style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;margin-bottom:20px;">


        <!-- Selection Process -->

    <h3 style="
    color:#1e40af;
    border-bottom:2px solid #2563eb;
    padding-bottom:10px;
    margin:30px 0 20px;
    ">
        Selection Process
    </h3>

    <label style="font-weight:600;display:block;margin-bottom:8px;">
        Selection Process Heading
    </label>

    <input type="text"
    name="selection_title"
    placeholder="Selection Process Heading"
    style="
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    margin-bottom:15px;
    ">

    <label style="font-weight:600;display:block;margin-bottom:8px;">
        Selection Process Description
    </label>

    <textarea
    name="selection_description"
    rows="4"
    style="
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    margin-bottom:20px;
    "></textarea>

    <!-- Step 1 -->

    <div style="margin-bottom:20px;">

        <input type="text"
        name="step1_title"
        placeholder="Step 1 Title"
        style="
        width:100%;
        padding:12px;
        border:1px solid #d1d5db;
        border-radius:8px;
        margin-bottom:10px;
        ">

        <textarea
        name="step1_description"
        rows="3"
        placeholder="Step 1 Description"
        style="
        width:100%;
        padding:12px;
        border:1px solid #d1d5db;
        border-radius:8px;
        "></textarea>

    </div>

    <!-- Step 2 -->

    <div style="margin-bottom:20px;">

        <input type="text"
        name="step2_title"
        placeholder="Step 2 Title"
        style="
        width:100%;
        padding:12px;
        border:1px solid #d1d5db;
        border-radius:8px;
        margin-bottom:10px;
        ">

        <textarea
        name="step2_description"
        rows="3"
        placeholder="Step 2 Description"
        style="
        width:100%;
        padding:12px;
        border:1px solid #d1d5db;
        border-radius:8px;
        "></textarea>

    </div>

    <!-- Step 3 -->

    <div style="margin-bottom:20px;">

        <input type="text"
        name="step3_title"
        placeholder="Step 3 Title"
        style="
        width:100%;
        padding:12px;
        border:1px solid #d1d5db;
        border-radius:8px;
        margin-bottom:10px;
        ">

        <textarea
        name="step3_description"
        rows="3"
        placeholder="Step 3 Description"
        style="
        width:100%;
        padding:12px;
        border:1px solid #d1d5db;
        border-radius:8px;
        "></textarea>

    </div>

    <!-- Step 4 -->

    <div style="margin-bottom:20px;">

        <input type="text"
        name="step4_title"
        placeholder="Step 4 Title"
        style="
        width:100%;
        padding:12px;
        border:1px solid #d1d5db;
        border-radius:8px;
        margin-bottom:10px;
        ">

        <textarea
        name="step4_description"
        rows="3"
        placeholder="Step 4 Description"
        style="
        width:100%;
        padding:12px;
        border:1px solid #d1d5db;
        border-radius:8px;
        "></textarea>

    </div>

    <!-- Submit Button -->

    <button
    type="submit"
    style="
    background:#2563eb;
    color:white;
    border:none;
    padding:14px 30px;
    border-radius:8px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    ">
        Save Exam Details
    </button>

</form>


<td style="
padding:10px;
border:1px solid #ddd;
text-align:center;
">

    <a href="{% url 'update_exam' i.id %}"
    style="
    background:#10b981;
    color:white;
    padding:8px 15px;
    border-radius:6px;
    text-decoration:none;
    font-weight:600;
    margin-right:5px;
    ">
        Update
    </a>

    <a href="{% url 'delete_exam' i.id %}"
    onclick="return confirm('Are you sure you want to delete this record?')"
    style="
    background:#ef4444;
    color:white;
    padding:8px 15px;
    border-radius:6px;
    text-decoration:none;
    font-weight:600;
    ">
        Delete
    </a>

</td>
