<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D Academy Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<style>


    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f4f7fb;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    display:flex;
    height:100vh;
    width:100%;
}

/* LEFT SIDE BIG */
.left-panel{
    flex:2;
    background:url("/static/ad/images/image.1.png") center/cover no-repeat;
    position:relative;
}

/* DARK OVERLAY */
.overlay{
    position:absolute;
    inset:0;
    background:rgba(0, 10, 31, 0.55);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:rgb(247, 242, 242);
    text-align:center;
}

/* LOGO TOP CENTER */
.logo-area{
    position:absolute;
    margin-top:60px;
    top:50px;
    left:50%;
    transform:translateX(-50%);
    z-index:2;
}

.logo-area img{
    height:200px;
}

.overlay h1{
    margin-top:160px;
    font-size:30px;
    margin-bottom:10px;
}
.overlay h2{
    font-size:40px;
    margin-bottom:10px;
    color:#ecb00b;
}
.academy-title{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
}

.academy-title h2{
    color: #d4a017;
    font-size: 40px;
    letter-spacing: 8px;
    margin: 0;
}

.academy-title span{
    width: 120px;
    height: 2px;
    background: linear-gradient(
        to right,
        transparent,
        #d4a017,
        transparent
    );
}
.tagline{
    font-size: 24px;
    margin-top: 10px;
    font-weight: 600;
    color: #ddb75e;
    margin-bottom: 20px;
    letter-spacing: 1px;
}

.description{
    font-size: 18px;
    line-height: 1.8;
    color: rgba(255,255,255,0.85);
    max-width: 500px;
    text-align: justify;
}

.overlay p{
    font-size:20px;
}


.right-panel{
    flex:1;
    background:rgb(255, 255, 255);
    padding:70px;
    display:flex;
    flex-direction:column;
    justify-content:center;

    
    
}
.user-icon{
    width:90px;
    height:90px;

    background:#eaf2ff;
    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    margin:0 auto 25px;
}



.title{
    
    font-size:28px;
    text-align:center;
    margin-bottom:30px;
    color:#112f6b;
    
}
.subtitle{
    margin-top:-20px;
    font-size:18px;
    text-align:center;
    margin-bottom:20px;
    color:#717c96;
}
form{
    display: flex;
    flex-direction: column;
}

input{
    width:100%;
    padding:14px;
    color:#f4f7fb;
    margin-bottom:15px;
    border:1px solid #5f96d1;
    border-radius:8px;
    font-size:16px;
}
.input-box{
    position: relative;
    margin-bottom: 20px;
}

.input-box i{
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: #676262;
    font-size: 16px;
}

.input-box input{
    width: 100%;
    padding: 18px 18px 18px 45px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 18px;
}






.login-btn{
    width:100%;
    padding:14px;
    background:#cfbb03;
    color:rgba(255, 255, 255, 0.984);
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

.login-btn:hover{
    background:#51a950;
    
    
    color: white;
    border-color: #b87790;
}





.left-panel{
    flex:2;
    background:url("/static/ad/images/image.1.png");

    background-size:cover;
    background-position:center;
}
.logo{
    width: 80px;
    height: 80px;
    background:url("/static/ad/images/image.1.png");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
}

.logo-section img{
    width:120px;
    background-image: url("/static/ad/images/image.1.png");
    height:auto;
    margin-bottom:10px;
}

.logo-section h1{
    color:#fff;
    font-size:42px;
    font-weight:700;
}


 @media (max-width: 768px){

    .container{
        flex-direction:column;
        height:auto;
    }

    .left-panel{
        min-height:250px;
    }

    .right-panel{
        padding:30px 20px;
    }

    .logo-section h1{
        font-size:28px;
    }

    .overlay p{
        font-size:16px;
    }
} 


</style>
<body>



<div class="container">

    <div class="left-panel">

        <div class="logo-area">
            <img src="/static/ad/images/logo.png" alt="Logo">
        </div>

        <div class="overlay">
            <h1>DHANRAJ </h1>
        <div class="academy-title">
            <span></span>
            <h2>ACADEMY</h2>
            <span></span>
        
        </div>
        
            <p class="tagline">Learn Today, Lead Tomorrow</p>
            <!-- <p class="description">
                Welcome to Dhanraj Academy. Learn, Prepare, and Succeed
                with quality education, expert guidance, and a commitment
                to academic excellence.
            </p> -->
        </div>

    </div>

    <!-- Right Side Login Form -->
    <div class="right-panel">
        <div class="login-box"></div>

            <h2 class="title">Welcome Back !</h2>
            <h2 class="subtitle">Start Your Learning Journey</h2>
            <form  method="post">
                {% csrf_token %}
            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text" name="email" placeholder="Username or Email">
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="password"  placeholder="Password">
            </div>
            <button class="login-btn">Login</button>
            </form>

    </div>

</div>

</body>
</html>
