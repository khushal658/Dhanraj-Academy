{% include "admin/navbar.html" %}

<!DOCTYPE html>
<html>
<head>
    <title>Add Video</title>

    <style>
        body{
            background:#f4f6fb;
            font-family: Arial;
            
        }

        .container{
            margin:0px auto;
        }

        .form-box, .table-box{
            background:#fff;
            padding:25px;
            border-radius:12px;
            box-shadow:0 10px 25px rgba(0,0,0,0.08);
            margin-bottom:20px;
        }

        h2{
            text-align:center;
            margin-bottom:15px;
        }

        input, textarea{
            width:100%;
            padding:10px;
            margin-bottom:10px;
            border:1px solid #ddd;
            border-radius:8px;
        }

        .btn{
            width:100%;
            padding:12px;
            background:#0d6efd;
            color:#fff;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

        .btn:hover{
            background:#0b5ed7;
        }

        table{
            width:100%;
            border-collapse: collapse;
        }

        th, td{
            padding:12px;
            border:1px solid #ddd;
            text-align:center;
        }

        th{
            background:#0d6efd;
            color:#fff;
        }

        .delete-btn{
            background:red;
            color:#fff;
            padding:6px 10px;
            border:none;
            border-radius:6px;
            cursor:pointer;
        }
        .edit-btn{
    background:#ffc107;
    color:#000;
    padding:6px 10px;
    border:none;
    border-radius:6px;
    text-decoration:none;
    margin-right:5px;
}

.delete-btn{
    background:red;
    color:#fff;
    padding:6px 10px;
    border:none;
    border-radius:6px;
    text-decoration:none;
}

.edit-btn,
.delete-btn{
    display:inline-block;
    padding:8px 14px;
    border-radius:6px;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    margin:2px;
}

.edit-btn{
    background:#ffc107;
    color:#000;
}

.delete-btn{
    background:#dc3545;
    color:#fff;
}

.action-column{
    white-space:nowrap;
    /* min-width:180px; */
}
    </style>
</head>

<body>

<div class="container" style="margin-top: 40px;">

    <!-- FORM -->
    <div class="form-box">
        <h2>Add Video</h2>

        <form method="POST" action="/add_video/" id="videoForm">
    {% csrf_token %}

    <input type="text"
           name="title"
           id="title"
           placeholder="Video Title"
           required
           minlength="3"
           maxlength="100">

    <textarea name="description"
              id="description"
              placeholder="Description"
              required
              minlength="10"
              maxlength="1000"></textarea>

    <input type="url"
           name="video_url"
           id="video_url"
           placeholder="YouTube URL"
           required>

    <small id="urlError" style="color:red;"></small>

    <button type="submit" class="btn">Save Video</button>
</form>
    </div>

    <!-- TABLE -->
    <div class="table-box">
        <h2>Video List</h2>

        <table>
            <tr>
                <th>Sr.No</th>
                <th>Title</th>
                <th>Description</th>
                <th>Video URL</th>
                <th class="action-column">Action</th>
            </tr>

{% for i in data %}
<tr>
    <td>{{ forloop.counter }}</td>
    <td>{{ i.title }}</td>
    <td>{{ i.description }}</td>

    <td>
        <a href="{{ i.video_url }}" target="_blank">Watch</a>
    </td>

   <td class="action-column">
    <a href="/edit_video/{{ i.id }}" class="edit-btn">
        Edit
    </a>

    <a href="/delete_video/{{ i.id }}" class="delete-btn">
        Delete
    </a>
</td>
</tr>
{% endfor %}
        </table>
    </div>

</div>

</body>
</html>
{% include "admin/footer.html" %}
