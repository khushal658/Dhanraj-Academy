
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

{% include "admin/navbar.html" %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10 col-12">

            <div class="card border-0 shadow-lg rounded-4">

                <!-- HEADER -->
                <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                    <h3 class="mb-0 fw-bold text-white">
                        <i class="fa fa-trophy me-2"></i>
                        Update Contact Us
                    </h3>
                </div>

                <!-- BODY -->
                <div class="card-body p-4">

                    <form method="POST" enctype="multipart/form-data" id="contactAboutForm">
                        {% csrf_token %}

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">icon</label>
                                <input type="text" name="icon" value="{{ update.icon }}" class="form-control form-control-lg" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Title</label>
                                <input type="text" name="title" value="{{ update.title }}" class="form-control form-control-lg" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Dec_1</label>
                                <input type="text" name="dec_1" value="{{ update.dec_1 }}" class="form-control form-control-lg" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Dec_2</label>
                                <input type="text" name="dec_2" value="{{ update.dec_2 }}" class="form-control form-control-lg" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Dec_3</label>
                                <input type="text" name="dec_3" value="{{ update.dec_3 }}" class="form-control form-control-lg" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">para</label>
                                <input type="text" name="para" value="{{ update.para }}" class="form-control form-control-lg" required>
                            </div>

                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 mt-4 rounded-3">
                            <i class="fa fa-save me-2"></i>
                            Update Contact About
                        </button>

                    </form>

                </div>

            </div>

        </div>
    </div>
</div>

{% include "admin/footer.html" %}

<!-- JS VALIDATION + POPUP -->
<script>
    document.getElementById("contactAboutForm").addEventListener("submit", function(e) {
        
        let inputs = document.querySelectorAll("#contactAboutForm input");
        let valid = true;

        inputs.forEach(input => {
            if (input.value.trim() === "") {
                valid = false;
            }
        });

        if (!valid) {
            alert("Please fill all fields!");
            e.preventDefault();
        } else {
            alert("Form submitted successfully!");
        }
    });
</script>
