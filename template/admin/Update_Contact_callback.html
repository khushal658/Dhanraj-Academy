<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

{% include "admin/navbar.html" %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8 col-md-10 col-12">

            <div class="card border-0 shadow-lg rounded-4">

                <!-- HEADER -->
                <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                    <h3 class="mb-0 fw-bold text-white">
                        <i class="fa fa-trophy me-2"></i>
                        Update Contact Call Back Form 
                    </h3>
                </div>

                <!-- BODY -->
                <div class="card-body p-4">

                    <form  method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="row g-3">

        

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">cb_name</label>
                                <input type="text" name="cb_name" value="{{ update.cb_name }}" class="form-control form-control-lg">
                            </div>

                               

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">cb_mobile </label>
                                <input type="text" name="cb_mobile" value="{{ update.cb_mobile }}" class="form-control form-control-lg">
                            </div>
                    
                      

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">cb_time</label>
                                <input type="text" name="cb_time" value="{{ update.cb_time }}" class="form-control form-control-lg">
                            </div>



                        

                           </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 mt-4 rounded-3">
                            <i class="fa fa-save me-2"></i>
                            Update Contact Call Back Form Table 
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% include "admin/footer.html" %}
