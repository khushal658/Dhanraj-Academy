{% include "admin/navbar.html" %}



<!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> -->

<style>
.update-card{
    max-width:1200px;
    margin:40px auto;
    background:#fff;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    overflow:hidden;
}

input{
    color: black;
}

.update-header{
    background:linear-gradient(135deg,#0d6efd,#0b5ed7);
    color:white;
    padding:20px;
    text-align:center;
}

.update-header h2{
    margin:0;
    font-weight:700;
}

.update-body{
    padding:30px;
}

.form-label{
    font-weight:600;
    margin-bottom:8px;
}

.form-control{
    border-radius:12px;
    border:1px solid #ddd;
    padding:12px;
}

.form-control:focus{
    border-color:#0d6efd;
    box-shadow:0 0 10px rgba(13,110,253,.2);
}

.btn-update{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#0d6efd;
    color:#fff;
    font-weight:600;
}

.btn-update:hover{
    background:#0b5ed7;
}
</style>

<div class="container">

    <div class="update-card">

        <div class="update-header">
            <h2>Update Mpsc Course</h2>
        </div>

        <div class="update-body">

            <form method="POST">
                {% csrf_token %}

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Dpartment</label>
                        <input type="text"
                               name="department"
                               value="{{ update_course.department }}"
                               class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Heading</label>
                        <input type="text"
                               name="course_name"
                               value="{{ update_course.course_name }}"
                               class="form-control">
                    </div>

                    

                </div>

                <hr>

                <div class="row">

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Duration Of course</label>
                        <input type="text"
                               name="duration"
                               value="{{ update_course.duration }}"
                               class="form-control">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Course Fee</label>
                        <input type="text"
                               name="fees"
                               value="{{ update_course.fees}}"
                               class="form-control">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Batch Timing</label>
                        <input type="text"
                               name="timing"
                               value="{{ update_course.timing }}"
                               class="form-control">
                    </div>

                    <!-- <div class="col-md-3 mb-3">
                        <label class="form-label">Course Number</label>
                        <input type="text" name="mode" value="{{ update_course.mode }}" class="form-control">
                    </div> -->

                     <div class="col-md-3 mb-3">
                        <label class="form-label">Extra Label</label>
                        <input type="text" name="extra_label" value="{{ update_course.extra_label }}" class="form-control">
                    </div>

                     <div class="col-md-3 mb-3">
                        <label class="form-label">Extra Value</label>
                        <input type="text" name="extra_value" value="{{ update_course.extra_value }}" class="form-control">
                    </div>




                     <div class="col-md-3 mb-3">
                        <label class="form-label">Heading</label>
                        <input type="text" name="heading" value="{{ update_course.heading }}" class="form-control">
                    </div>


                     <div class="col-md-3 mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" name="title" value="{{ update_course.title }}" class="form-control">
                    </div>


                     <div class="col-md-3 mb-3">
                        <label class="form-label">Eligibility</label>
                        <input type="text" name="eligibility" value="{{ update_course.eligibility }}" class="form-control">
                    </div>



                     <div class="col-md-3 mb-3">
                        <label class="form-label">Benifiet 1</label>
                        <input type="text" name="benefit1" value="{{ update_course.benefit1 }}" class="form-control">
                    </div>


                     <div class="col-md-3 mb-3">
                        <label class="form-label">Benifiet 2</label>
                        <input type="text" name="benefit2" value="{{ update_course.benefit2 }}" class="form-control">
                    </div>


                     <div class="col-md-3 mb-3">
                        <label class="form-label">Benifiet 3</label>
                        <input type="text" name="benefit3" value="{{ update_course.benefit3 }}" class="form-control">
                    </div>


                     <div class="col-md-3 mb-3">
                        <label class="form-label">Benifiet 4</label>
                        <input type="text" name="benefit4" value="{{ update_course.benefit4 }}" class="form-control">
                    </div>


                     <div class="col-md-3 mb-3">
                        <label class="form-label">Benifiet 5</label>
                        <input type="text" name="benefit5" value="{{ update_course.benefit5 }}" class="form-control">
                    </div>


                    <div class="col-md-3 mb-3">
                        <label class="form-label">Addmission  Notice</label>
                        <textarea type="text" name="admission_notice" class="form-control">{{ update_course.benefit5 }}</textarea>
                    </div>



                    

                </div>

                <button type="submit" class="btn-update">
                    Update Information
                </button>

            </form>

        </div>

    </div>

</div>

{% include "admin/footer.html" %}
