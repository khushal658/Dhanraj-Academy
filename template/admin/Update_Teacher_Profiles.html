
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

{% include "admin/navbar.html" %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10 col-12">

            <div class="card border-0 shadow-lg rounded-4">

                <!-- HEADER -->
                <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                    <h3 class="mb-0 fw-bold text-white">
                        <i class="fa fa-trophy me-2"></i>
                        Update Teacher Profile
                    </h3>
                </div>

                <!-- BODY -->
                <div class="card-body p-4">

                    <form method="POST" enctype="multipart/form-data" id="teacherForm">
                        {% csrf_token %}

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Profiles</label>
                                <input type="file" name="images" class="form-control form-control-lg">
                            </div>

                            {% if update.images %}
                                <img src="{{ update.images.url }}" height="100px" class="mb-2 d-block">
                            {% endif %}

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">fullname</label>
                                <input type="text" name="fullname" value="{{ update.fullname }}" class="form-control form-control-lg" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Traner</label>
                                <input type="text" name="traner" value="{{ update.traner }}" class="form-control form-control-lg" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Experience</label>
                                <input type="text" name="experience" value="{{ update.experience }}" class="form-control form-control-lg" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Linkedin</label>
                                <input type="text" name="linkedin" value="{{ update.linkedin }}" class="form-control form-control-lg" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Instagram</label>
                                <input type="text" name="instagram" value="{{ update.instagram }}" class="form-control form-control-lg" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Twitter</label>
                                <input type="text" name="twitter" value="{{ update.twitter }}" class="form-control form-control-lg" required>
                            </div>

                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 mt-4 rounded-3">
                            <i class="fa fa-save me-2"></i>
                            Update Teacher profile
                        </button>

                    </form>

                </div>

            </div>

        </div>
    </div>
</div>

{% include "admin/footer.html" %}
