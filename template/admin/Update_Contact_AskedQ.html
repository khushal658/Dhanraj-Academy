<div class="row justify-content-center">

    <div class="col-lg-8 col-md-10 col-12">

        <div class="card border-0 shadow-lg rounded-4">

            <!-- HEADER -->
            <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                <h3 class="mb-0 fw-bold text-white">
                    Update Contact Asked Que
                </h3>
            </div>

            <!-- BODY -->
            <div class="card-body p-4">

                <form method="POST">
                    {% csrf_token %}

                    <div class="row g-3">

                        <div class="col-12">
                            <label class="form-label fw-semibold">Questions</label>
                            <textarea name="que"
                                      class="form-control form-control-lg"
                                      rows="4"
                                      required>{{ update.que }}</textarea>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Answer</label>
                            <textarea name="ans"
                                      class="form-control form-control-lg"
                                      rows="4"
                                      required>{{ update.ans }}</textarea>
                        </div>

                    </div>

                    <button type="submit"
                            class="btn btn-primary btn-lg w-100 mt-4 rounded-3">
                        Update Contact Asked Que
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
```

</div>

<script>
document.querySelector("form").addEventListener("submit", function(e){

    let oldQue = `{{ update.que|escapejs }}`;
    let oldAns = `{{ update.ans|escapejs }}`;

    let newQue = document.querySelector('textarea[name="que"]').value;
    let newAns = document.querySelector('textarea[name="ans"]').value;

    if(oldQue === newQue && oldAns === newAns){
        e.preventDefault();

        Swal.fire({
            icon: "warning",
            title: "No Changes",
            text: "You have not made any changes!",
            confirmButtonText: "OK"
        });
    }
});
</script>
