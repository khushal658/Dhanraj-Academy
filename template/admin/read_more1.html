{% include "admin/navbar.html" %}

<style>
body{
    background:#f4f7fc;
    font-family:Arial, sans-serif;
}

/* Main Container */
.container{
    width:95%;
    margin:auto;
    padding:20px;
}

/* Card Design */
.card{
    background:#fff;
    border:none;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
    margin-bottom:35px;
}

/* Header */
.card-header{
    background:#2563eb;
    color:white;
    padding:18px 25px;
}

.card-header h4{
    margin:0;
    font-size:24px;
    font-weight:600;
}

/* Card Body */
.card-body{
    padding:30px;
}

/* Labels */
.form-label{
    display:block;
    margin-bottom:8px;
    font-size:16px;
    font-weight:600;
    color:#374151;
}

/* Inputs */
.form-control{
    width:100%;
    padding:14px 16px;
    border:1px solid #dbe3f1;
    border-radius:12px;
    font-size:15px;
    outline:none;
    box-sizing:border-box;
}

.form-control:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,.15);
}

/* Submit Button */
.btn-primary{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
}

.btn-primary:hover{
    background:#1d4ed8;
}

/* Table */
.table-responsive{
    overflow-x:auto;
}

.table{
    width:100%;
    border-collapse:collapse;
}

.table th{
    background:#eff6ff;
    color:#1e40af;
    padding:15px;
    text-align:left;
    font-size:15px;
    font-weight:700;
}

.table td{
    padding:15px;
    border-bottom:1px solid #eef2f7;
}

.table tr:hover{
    background:#f8fbff;
}

/* Badges */
.badge{
    display:inline-block;
    padding:8px 14px;
    border-radius:30px;
    font-size:13px;
    font-weight:600;
}

.bg-secondary{
    background:#e5e7eb;
    color:#374151;
}

.bg-info{
    background:#dbeafe;
    color:#1d4ed8;
}

/* Delete Button */
.delete-btn{
    background:#ef4444;
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    display:inline-block;
}

.delete-btn:hover{
    background:#dc2626;
    color:white;
}

/* Mobile */
@media(max-width:768px){

    .container{
        width:98%;
    }

    .card-body{
        padding:20px;
    }

    .table{
        min-width:700px;
    }

    .delete-btn{
        padding:8px 12px;
    }
}
</style>
<div class="container py-4">

    <!-- Update Form -->
    <div class="card border-0 shadow-lg mb-5">
        <div class="card-header bg-primary text-white py-3">
            <h4 class="mb-0">
                <i class="fas fa-edit"></i> Update Exam Schedule
            </h4>
        </div>

        <div class="card-body">

<form method="POST" action="/exam/">
    
    {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-bold">
                        Exam Name
                    </label>
                    <input type="text"
                           name="exam_name"
                           value="{{ data.exam_name }}"
                           class="form-control form-control-lg">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">
                        Exam Date
                    </label>
                    <input type="text"
                           name="exam_date"
                           value="{{ data.exam_date }}"
                           class="form-control form-control-lg">
                </div>

               <button type="submit" class="btn btn-primary px-4" style="min-width:220px;">
                    Update Schedule
                </button>
            </form>

        </div>
    </div>


    <!-- Table -->
    <div class="card border-0 shadow-lg" style="margin-top: 5%;">

<div class="card-header bg-primary text-white py-3">
    <h4 class="mb-0">
        📅 Exam Schedule List
    </h4>
</div>
        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead>
                        <tr>
                            <th>Sr.No</th>
                            <th>Exam Name</th>
                            <th>Exam Date</th>
                            <th width="120">Action</th>
                        </tr>
                    </thead>

<tbody>

    {% for i in all_data %}
    <tr>

        <td>
            <span class="badge bg-secondary">
                {{ forloop.counter }}
            </span>
        </td>

        <td class="fw-semibold">
            {{ i.exam_name }}
        </td>

        <td>
            <span class="badge bg-info text-dark px-3 py-2">
                {{ i.exam_date }}
            </span>
        </td>

        <td>
         <a href="/admin/delete_exam/{{ i.id }}/"
            class="delete-btn"
            onclick="return confirm('Are you sure you want to delete this record?')">
            Delete
            </a>
        </td>

    </tr>
    {% empty %}
    <tr>
        <td colspan="4" class="text-center py-4">
            No Data Found
        </td>
    </tr>
    {% endfor %}

</tbody>
                </table>

            </div>

        </div>

    </div>

</div>
{% include "admin/footer.html" %}
