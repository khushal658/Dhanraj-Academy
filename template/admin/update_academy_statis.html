{% include "admin/navbar.html" %}

<style>
    .container{
    width:95%;
    margin:auto;
    padding:20px;
}

.card{
    background:#fff;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    margin-bottom:20px;
}

.card-header{
    background:#0d6efd;
    color:#fff;
    padding:15px;
    font-size:20px;
    font-weight:bold;
}

.card-body{
    padding:20px;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:600;
}

.form-control{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

.btn{
    padding:8px 15px;
    border:none;
    border-radius:5px;
    text-decoration:none;
    cursor:pointer;
}

.btn-success{
    background:#198754;
    color:white;
}

.btn-warning{
    background:#ffc107;
    color:black;
}

.btn-danger{
    background:#dc3545;
    color:white;
}
</style>

<body>

    <div class="container">

    <!-- Update Form Card -->
    <div class="card">
        <div class="card-header">
            Update Academy Statistic
        </div>

        <div class="card-body">
            <form  method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label>Statistic Title</label>
                    <input type="text"
                           name="statistic_title"
                           class="form-control"
                           value="{{ update_statistics.statistic_title }}"
                           required>
                </div>

                <div class="form-group">
                    <label>Statistic Count</label>
                    <input type="number"
                           name="statistic_count"
                           class="form-control"
                           value="{{ update_statistics.statistic_count }}"
                           required>
                </div>

                <div class="form-group">
                    <label>Bootstrap Icon Class</label>
                    <input type="text"
                           name="statistic_icon"
                           class="form-control"
                           value="{{ update_statistics.statistic_icon }}"
                           placeholder="bi bi-people-fill"
                           required>
                </div>

                <button type="submit" class="btn btn-warning" onclick="alert('Updated  Statistics Successfully')">
                    Update
                </button>

               
            </form>
        </div>
    </div>

</div>
</body>
