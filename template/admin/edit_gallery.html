
{% include "admin/navbar.html" %}

<!DOCTYPE html>
<html>
<head>
    <title>Edit Gallery</title>

    <style>
        
        body{
            background:#f4f7fc;
        }

        .container{
            width:95%;
            max-width:850px;
            margin:0px auto;
        }

        .card-box{
            background:#fff;
            padding:35px;
            border-radius:18px;
            box-shadow:0 8px 25px rgba(0,0,0,0.08);
        }

        .title{
            text-align:center;
            color:#0d6efd;
            font-size:32px;
            font-weight:700;
            margin-bottom:25px;
        }

        .form-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            font-size:15px;
            font-weight:600;
            color:#444;
            margin-bottom:8px;
        }

        .form-control{
            width:100%;
            padding:12px 14px;
            border:1px solid #d8dce3;
            border-radius:10px;
            font-size:15px;
            transition:.3s;
            background:#fff;
        }

        .form-control:focus{
            outline:none;
            border-color:#0d6efd;
            box-shadow:0 0 8px rgba(13,110,253,.20);
        }

        textarea.form-control{
            min-height:120px;
            resize:vertical;
        }

        .image-box{
            margin-top:10px;
        }

        .image-box img{
            width:220px;
            border-radius:12px;
            border:3px solid #e9ecef;
            padding:3px;
        }

        .btn-update{
            width:100%;
            border:none;
            background:#0d6efd;
            color:white;
            padding:14px;
            border-radius:10px;
            font-size:17px;
            font-weight:600;
            cursor:pointer;
            transition:.3s;
        }

        .btn-update:hover{
            background:#0b5ed7;
        }

        .file-input{
            padding:10px;
            background:#fafafa;
        }

        @media(max-width:768px){

            .container{
                width:98%;
            }

            .card-box{
                padding:20px;
            }

            .title{
                font-size:26px;
            }

            .image-box img{
                width:100%;
                max-width:250px;
            }
        }
    </style>
</head>

<body>

<div class="container" style="margin-top: 40px;">

    <div class="card-box">

        <h2 class="title">Edit Gallery</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Category -->
            <div class="form-group">
                <label>Category</label>

                <select name="category" class="form-control">

                    <option value="Police Bharti" {% if data.category == "Police Bharti" %}selected{% endif %}>
                        Police Bharti
                    </option>

                    <option value="Talathi" {% if data.category == "Talathi" %}selected{% endif %}>
                        Talathi
                    </option>

                    <option value="Gramsevak" {% if data.category == "Gramsevak" %}selected{% endif %}>
                        Gramsevak
                    </option>

                    <option value="Vanrakshak" {% if data.category == "Vanrakshak" %}selected{% endif %}>
                        Vanrakshak
                    </option>

                    <option value="MPSC" {% if data.category == "MPSC" %}selected{% endif %}>
                        MPSC
                    </option>

                </select>
            </div>

            <!-- Title -->
            <div class="form-group">
                <label>Title</label>

                <input type="text"
                       name="title"
                       class="form-control"
                       value="{{ data.title }}">
            </div>

            <!-- Description -->
            <div class="form-group">
                <label>Description</label>

                <textarea name="description"
                          class="form-control">{{ data.description }}</textarea>
            </div>

            <!-- Current Image -->
            {% if data.image %}
<!-- Change Image -->
<div class="form-group">
    <label>Change Image</label>

    <input type="file"
           name="image"
           id="imageInput"
           class="form-control file-input"
           accept="image/jpeg,image/jpg,image/png,image/webp">

    <small id="imageError" style="color:red;"></small>
</div>            {% endif %}

            <!-- Change Image -->
            <div class="form-group">
                <label>Change Image</label>

                <input type="file"
                       name="image"
                       class="form-control file-input">
            </div>

            <button type="submit" class="btn-update">
                Update Gallery
            </button>

        </form>

    </div>

</div>

</body>
</html>
<script>
document.getElementById("imageInput").addEventListener("change", function() {

    let file = this.files[0];
    let error = document.getElementById("imageError");

    if(file){

        let allowedTypes = [
            "image/jpeg",
            "image/jpg",
            "image/png",
            "image/webp"
        ];

        if(!allowedTypes.includes(file.type)){
            error.innerHTML = "Only JPG, JPEG, PNG and WEBP images are allowed.";
            this.value = "";
        } else {
            error.innerHTML = "";
        }
    }
});
</script>
